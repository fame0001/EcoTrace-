<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoTrace+ | ESG Platform</title>

<style>
body{
  margin:0;
  font-family:"Segoe UI",Arial;
  background:linear-gradient(180deg,#dcfce7,#f0fdf4);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ===== Login Box ===== */
.box{
  background:white;
  padding:50px;
  width:380px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,.15);
}

h1{color:#166534;margin-bottom:10px}
p{color:#374151;font-size:14px;margin-bottom:30px}

input{
  width:100%;
  padding:12px 14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:#22c55e;
}

button{
  width:100%;
  margin-top:10px;
  padding:14px;
  background:#22c55e;
  color:#052e16;
  border:none;
  border-radius:999px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#ecfeff;
  color:#166534;
  border:1px solid #86efac;
}

small{
  display:block;
  margin-top:15px;
  color:#6b7280;
}

/* ===== Toast Notification ===== */
.toast{
  position:fixed;
  top:20px;
  right:20px;
  min-width:280px;
  padding:16px 20px;
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;
  transform:translateY(-20px);
  transition:all .4s ease;
  z-index:9999;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.success{
  background:linear-gradient(135deg,#22c55e,#4ade80);
}

.toast.error{
  background:linear-gradient(135deg,#ef4444,#f87171);
}
</style>
</head>

<body>

<div class="box">
  <h1>🌿 EcoTrace+</h1>
  <p>
    ESG Sustainability Monitoring Platform<br>
    Track • Analyze • Improve Environmental Impact
  </p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button class="secondary" onclick="register()">Register</button>

  <small>© 2025 EcoTrace+ ESG Platform</small>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* 🔐 Firebase Config (ของคุณ) */
const firebaseConfig = {
  apiKey: "AIzaSyDfqNxfG1zxo_tt8bsPrkTljcMzkDzf9i8",
  authDomain: "ecotrace-8ba00.firebaseapp.com",
  projectId: "ecotrace-8ba00",
  storageBucket: "ecotrace-8ba00.firebasestorage.app",
  messagingSenderId: "87765091380",
  appId: "1:87765091380:web:fe6c34ec9d1c9ee7a8b661"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ===== Toast Function ===== */
function showToast(message,type="success"){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = `toast ${type} show`;
  setTimeout(()=>toast.classList.remove("show"),3000);
}

/* ===== Login ===== */
window.login = function(){
  const email = emailInput();
  const password = passwordInput();

  signInWithEmailAndPassword(auth,email,password)
    .then(()=>{
      showToast("Login successful 🌿","success");
      setTimeout(()=>location.href="dashboard.html",1200);
    })
    .catch(err=>{
      showToast("Login failed: "+err.message,"error");
    });
}

/* ===== Register ===== */
window.register = function(){
  const email = emailInput();
  const password = passwordInput();

  createUserWithEmailAndPassword(auth,email,password)
    .then(()=>{
      showToast("Register successful 🎉","success");
      setTimeout(()=>location.href="dashboard.html",1200);
    })
    .catch(err=>{
      showToast("Register failed: "+err.message,"error");
    });
}

/* ===== Auto Redirect ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    location.href="dashboard.html";
  }
});

/* Helpers */
function emailInput(){ return document.getElementById("email").value; }
function passwordInput(){ return document.getElementById("password").value; }
</script>

</body>
</html>
